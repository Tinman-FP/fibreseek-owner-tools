name: Release desktop applications

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS Apple Silicon
            command: ./scripts/build_desktop_app.sh
          - os: macos-15-intel
            label: macOS Intel
            command: ./scripts/build_desktop_app.sh
          - os: windows-latest
            label: Windows x64
            command: powershell -ExecutionPolicy Bypass -File scripts/build_desktop_app.ps1
          - os: ubuntu-latest
            label: Linux x64
            command: PYTHON_BIN=/usr/bin/python3 ./scripts/build_desktop_app.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - name: Install Linux Tk
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-pip python3-tk python3-venv
      - name: Run tests on macOS and Windows
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          /usr/bin/python3 -m venv .test-venv
          .test-venv/bin/python -m pip install -r requirements.txt
          .test-venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - name: Build application
        shell: bash
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-${{ runner.arch }}
          path: dist-desktop/release/*
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
